<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#030712">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <title>Promotor Ajudante Pro</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: white;
            margin: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .secao { display: none; height: 100vh; height: 100dvh; flex-direction: column; }
        .secao.ativa { display: flex !important; }

        .card-app {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 0.8rem;
        }

        .nav-aba.ativa { background-color: #f59e0b !important; color: #030712 !important; }

        .input-custom {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            padding: 0.8rem;
            border-radius: 0.8rem;
            color: white;
            outline: none;
            font-size: 16px; /* evita zoom automático no iPhone */
        }
        .input-custom:focus { border-color: #f59e0b; }

        .btn-amarelo {
            background-color: #f59e0b;
            color: #030712;
            font-weight: 900;
            padding: 1rem;
            border-radius: 0.8rem;
            text-transform: uppercase;
            width: 100%;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            border: none;
        }
        .btn-amarelo:disabled { opacity: .5; }

        #modal-container {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 1.5rem;
            backdrop-filter: blur(6px);
        }

        button { cursor: pointer; }
        button:focus-visible, [data-act]:focus-visible { outline: 2px solid #f59e0b; outline-offset: 2px; }

        /* Relatório impresso (PDF): só o #print-area aparece ao imprimir */
        #print-area { display: none; }
        @media print {
            @page { size: A4; margin: 14mm 14mm 16mm; }
            html, body { overflow: visible !important; height: auto !important; background: #fff !important; color: #111 !important; }
            body > *:not(#print-area) { display: none !important; }
            #print-area { display: block !important; font-family: 'Inter', Arial, sans-serif; color: #111; }
            #print-area, #print-area * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .rel-card { break-inside: avoid; page-break-inside: avoid; }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <!-- MODAL -->
    <div id="modal-container" role="dialog" aria-modal="true">
        <div class="bg-[#111827] border border-gray-800 rounded-[2rem] w-full max-w-xs p-8 shadow-2xl">
            <h2 id="modal-titulo" class="text-amber-500 font-black text-[10px] uppercase italic tracking-widest mb-2">SISTEMA</h2>
            <p id="modal-subtext" class="text-white text-sm mb-6 font-medium leading-relaxed"></p>
            <div id="modal-input-area" class="mb-4">
                <input id="modal-input" class="input-custom border-amber-500/20" type="text" maxlength="80">
            </div>
            <div class="flex gap-3">
                <button id="btn-cancelar" class="flex-1 py-3 text-[10px] font-black uppercase text-gray-500">CANCELAR</button>
                <button id="modal-confirm" class="flex-1 bg-amber-500 text-gray-950 py-4 rounded-2xl text-[10px] font-black uppercase shadow-lg shadow-amber-500/20">CONFIRMAR</button>
            </div>
        </div>
    </div>

    <!-- CARREGANDO / CONFIGURAÇÃO -->
    <section id="tela-carregando" class="secao ativa items-center justify-center p-6 text-center">
        <img src="logo.png" onerror="this.src='https://raw.githubusercontent.com/melobortolatorenan-max/Promotor-ajudante/main/logo.png'" class="w-16 h-16 rounded-2xl mb-4" alt="">
        <div id="carregando-txt" class="text-[10px] font-black uppercase tracking-widest text-gray-500">Carregando...</div>
    </section>

    <!-- LOGIN / CRIAR CONTA -->
    <section id="tela-auth" class="secao overflow-y-auto no-scrollbar">
        <div class="m-auto w-full max-w-sm p-6">
            <div class="flex items-center gap-3 mb-8">
                <img src="logo.png" onerror="this.src='https://raw.githubusercontent.com/melobortolatorenan-max/Promotor-ajudante/main/logo.png'" class="w-12 h-12 rounded-xl" alt="">
                <div>
                    <h1 class="text-[9px] font-bold text-gray-500 uppercase tracking-widest leading-none">Promotor</h1>
                    <span class="text-2xl font-black text-amber-500 uppercase italic leading-none">Ajudante</span>
                </div>
            </div>
            <h2 id="auth-titulo" class="text-amber-500 font-black italic uppercase text-lg mb-6">Entrar</h2>
            <div class="space-y-4">
                <input id="a-nome" class="input-custom hidden" placeholder="Seu nome" autocomplete="name" maxlength="60">
                <input id="a-email" class="input-custom" type="email" placeholder="E-mail" autocomplete="email" inputmode="email">
                <input id="a-senha" class="input-custom" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password">
                <p id="a-erro" class="text-red-500 text-[11px] font-bold min-h-[1rem]" role="alert"></p>
                <button id="a-btn" data-act="authSubmit" class="btn-amarelo">ENTRAR</button>
                <div class="flex items-center gap-3 text-gray-600 text-[9px] font-black uppercase"><span class="flex-1 h-px bg-gray-800"></span>ou<span class="flex-1 h-px bg-gray-800"></span></div>
                <button id="a-google" data-act="authGoogle" class="w-full py-4 rounded-xl border border-gray-700 bg-gray-900 text-[10px] font-black uppercase text-white flex items-center justify-center gap-3">
                    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.1 5.5c4.3-4 6.8-9.9 6.8-16.9z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.4-4.6 2.3-8.8 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
                    ENTRAR COM O GOOGLE
                </button>
                <button id="a-troca" data-act="authModo" class="w-full py-3 text-[10px] font-black text-gray-400 uppercase">CRIAR CONTA NOVA</button>
                <button data-act="authReset" class="w-full py-2 text-[10px] font-black text-gray-600 uppercase">ESQUECI A SENHA</button>
            </div>
        </div>
    </section>

    <!-- APP -->
    <section id="tela-app" class="secao">
        <header class="p-4 border-b border-gray-800 bg-gray-950/80 sticky top-0 z-50" style="padding-top:max(1rem, env(safe-area-inset-top))">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <img src="logo.png" onerror="this.src='https://raw.githubusercontent.com/melobortolatorenan-max/Promotor-ajudante/main/logo.png'" class="w-10 h-10 rounded-xl" alt="">
                    <div>
                        <h1 class="text-[9px] font-bold text-gray-500 uppercase tracking-widest leading-none">Promotor</h1>
                        <span class="text-xl font-black text-amber-500 uppercase italic leading-none">Ajudante</span>
                    </div>
                </div>
                <div class="flex items-center gap-1">
                    <button id="btn-venc" data-act="novoVencido" class="flex items-center gap-1.5 border border-red-500/50 text-red-500 px-2.5 py-2 rounded-xl text-[10px] font-black uppercase" aria-label="Registrar produto vencido"><i data-lucide="package-x" class="w-4 h-4"></i> Vencido</button>
                    <button id="btn-conta" data-act="tab" data-id="c" class="p-2 text-gray-500" aria-label="Minha conta e notificações"><i data-lucide="settings" class="w-5 h-5"></i></button>
                </div>
            </div>
            <nav class="flex gap-1 bg-gray-900 p-1 rounded-2xl border border-gray-800">
                <button data-act="tab" data-id="h" class="nav-aba flex-1 py-2 rounded-xl text-[9px] font-black uppercase">Início</button>
                <button data-act="tab" data-id="l" class="nav-aba flex-1 py-2 rounded-xl text-[9px] font-black uppercase">Lojas</button>
                <button data-act="tab" data-id="p" class="nav-aba flex-1 py-2 rounded-xl text-[9px] font-black uppercase">Produtos</button>
            </nav>
        </header>
        <main id="corpo" class="p-4 flex-1 overflow-y-auto no-scrollbar pb-24"></main>
    </section>

    <div id="print-area" aria-hidden="true"></div>

    <script src="firebase-config.js"></script>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, updateProfile, GoogleAuthProvider, signInWithPopup }
        from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, writeBatch, serverTimestamp }
        from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { getMessaging, getToken, deleteToken, onMessage, isSupported }
        from "https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js";

    /* ================= utilidades ================= */
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt = (d) => d.split('-').reverse().join('/');
    // dias entre hoje (fuso do aparelho) e a data 'AAAA-MM-DD'. Negativo = já venceu.
    const mesAtualISO = () => isoLocal(new Date()).slice(0, 7);
    // Só valem os registros do mês corrente; os de meses anteriores são apagados automaticamente
    const vencMes = () => vencidos.filter(v => (v.dataRetirada || '').slice(0, 7) === mesAtualISO());
    function diasParaFimDoMes() {
        const h = new Date(); h.setHours(0, 0, 0, 0);
        return Math.round((new Date(h.getFullYear(), h.getMonth() + 1, 0) - h) / 86400000);
    }
    function ultimoDiaDoMes() { const h = new Date(); return isoLocal(new Date(h.getFullYear(), h.getMonth() + 1, 0)); }
    const PERIODOS = [['dia', 'Hoje'], ['semana', 'Esta semana'], ['15', 'Últimos 15 dias'], ['mes', 'Mês todo']];
    // Faixa de datas de cada período (sempre limitada ao mês corrente)
    function faixaPeriodo(tipo) {
        const h = new Date(); h.setHours(0, 0, 0, 0);
        const fim = isoLocal(h), primeiro = fim.slice(0, 8) + '01';
        let ini = fim, fimRot = fim;
        if (tipo === 'semana') { const d = new Date(h); d.setDate(d.getDate() - ((h.getDay() + 6) % 7)); ini = isoLocal(d); }   // segunda-feira
        if (tipo === '15') { const d = new Date(h); d.setDate(d.getDate() - 14); ini = isoLocal(d); }
        if (tipo === 'mes') { ini = primeiro; fimRot = ultimoDiaDoMes(); }
        if (ini < primeiro) ini = primeiro;
        return { ini, fim, fimRot };
    }
    const isoLocal = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    function diasAte(dataISO) {
        const [y, m, d] = dataISO.split('-').map(Number);
        const alvo = new Date(y, m - 1, d);
        const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
        return Math.round((alvo - hoje) / 86400000);
    }
    const plural = (n, a, b) => n === 1 ? a : b;

    /* ================= estado ================= */
    let app, auth, db, messaging, msgOk = false;
    let uid = null, userInfo = null;
    let lojas = [], produtos = [], vencidos = [];
    let vencErro = '';      // preenchido se as regras do Firebase ainda não liberam 'vencidos'
    let filtroVenc = '';    // filtro de marca na tela Relatório de vencidos
    let unsubs = [];
    let prontoProd = false;
    let view = { tab: 'h', lojaId: null, marcaId: null, prod: null, preLoja: null, preMarca: '', origem: null, origemMarca: null };
    let modoCriar = false;
    const ignorados = new Set(JSON.parse(sessionStorage.getItem('ign_venc') || '[]'));

    const colLojas = () => collection(db, 'users', uid, 'lojas');
    const colProd  = () => collection(db, 'users', uid, 'produtos');
    const refLoja  = (id) => doc(db, 'users', uid, 'lojas', id);
    const refProd  = (id) => doc(db, 'users', uid, 'produtos', id);
    const colVenc  = () => collection(db, 'users', uid, 'vencidos');
    const refVenc  = (id) => doc(db, 'users', uid, 'vencidos', id);
    const nomeLoja = (id) => (lojas.find(l => l.id === id) || {}).nome || '—';
    // As marcas ficam dentro do documento da loja: loja.marcas = [{ id, nome }]
    const marcasDe = (lojaId) => ((lojas.find(l => l.id === lojaId) || {}).marcas) || [];
    const nomeMarca = (lojaId, marcaId) => (marcasDe(lojaId).find(m => m.id === marcaId) || {}).nome || '';
    const doMarca = (p, marcaId) => marcaId === '_sem' ? !p.marcaId : p.marcaId === marcaId;
    const rotuloLoja = (p) => esc(nomeLoja(p.lojaId)) + (p.marcaId && nomeMarca(p.lojaId, p.marcaId) ? ' · ' + esc(nomeMarca(p.lojaId, p.marcaId)) : '');
    const norm = (s) => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    let ultimaMarca = '';
    // Campo "Marca" do formulário: sem marcas na loja vira um botão "Cadastrar marca";
    // com marcas vira uma lista, e "+ Cadastrar marca" é sempre a última opção.
    function campoMarca(lojaId, sel, extras = []) {
        ultimaMarca = sel || '';
        const lista = [...marcasDe(lojaId)];
        extras.forEach(x => { if (!lista.some(m => m.id === x.id)) lista.push(x); });
        if (!lista.length) {
            return `<button type="button" data-act="novaMarcaForm" class="input-custom text-left text-amber-500 font-black uppercase text-xs">+ Cadastrar marca</button>`;
        }
        return `<select id="pm" class="input-custom"><option value="">Selecione a marca...</option>` +
            lista.map(m => `<option value="${esc(m.id)}" ${m.id === sel ? 'selected' : ''}>${esc(m.nome)}</option>`).join('') +
            `<option value="__nova">+ Cadastrar marca</option></select>`;
    }
    function refreshCampoMarca(lojaId, sel, extras) {
        const c = $('#campo-marca'); if (c) c.innerHTML = campoMarca(lojaId, sel, extras);
    }
    // Sugestões de nomes de produtos já cadastrados (ignora maiúsculas e acentos)
    function sugestoes(texto) {
        const q = norm(texto);
        if (!q) return [];
        const vistos = new Map();
        [...produtos, ...vencidos].forEach(p => { const k = norm(p.nome); if (k && !vistos.has(k)) vistos.set(k, p.nome.trim()); });
        return [...vistos.entries()]
            .filter(([k]) => k.includes(q) && k !== q)
            .sort((a, b) => (b[0].startsWith(q) - a[0].startsWith(q)) || a[0].localeCompare(b[0]))
            .slice(0, 6).map(e => e[1]);
    }
    function mostrarSugestoes() {
        const box = $('#sug'), inp = $('#pn'); if (!box || !inp) return;
        const lista = sugestoes(inp.value);
        if (!lista.length) { box.classList.add('hidden'); box.innerHTML = ''; return; }
        box.innerHTML = lista.map(n => `<button type="button" data-act="pickSug" data-nome="${esc(n)}" class="w-full text-left px-3 py-3 text-xs font-black italic uppercase text-white border-b border-white/5 active:bg-amber-500 active:text-gray-950">${esc(n)}</button>`).join('');
        box.classList.remove('hidden');
    }

    function erroVenc(e) {
        console.error(e);
        if (e && e.code === 'permission-denied') {
            vencErro = 'permission-denied';
            return aviso('SEM PERMISSÃO PARA SALVAR OS VENCIDOS. As regras do Firebase ainda precisam ser atualizadas.', { soConfirmar: true });
        }
        erroDb(e);
    }
    function erroDb(e) {
        console.error(e);
        const msg = e && e.code === 'permission-denied'
            ? 'Sem permissão. Saia e entre novamente.'
            : 'Não foi possível salvar. Verifique a conexão e tente de novo.';
        aviso(msg, { soConfirmar: true });
    }

    /* ================= modal ================= */
    const modal = $('#modal-container');
    function fecharModal() { modal.style.display = 'none'; }
    function aviso(msg, o = {}) {
        $('#modal-titulo').textContent = o.titulo || 'SISTEMA';
        $('#modal-subtext').innerHTML = msg; // quem chama escapa o conteúdo dinâmico
        const inp = $('#modal-input');
        const temInput = o.input !== undefined && o.input !== null;
        $('#modal-input-area').style.display = temInput ? 'block' : 'none';
        if (temInput) inp.value = o.input;
        $('#btn-cancelar').style.display = o.soConfirmar ? 'none' : 'block';
        modal.style.display = 'flex';
        $('#btn-cancelar').onclick = () => { fecharModal(); if (o.cancel) o.cancel(); };
        $('#modal-confirm').onclick = () => { const v = temInput ? inp.value.trim() : true; fecharModal(); if (o.ok) o.ok(v); };
        setTimeout(() => (temInput ? inp : $('#modal-confirm')).focus(), 50);
    }
    document.addEventListener('keydown', (e) => {
        if (modal.style.display !== 'flex') {
            if (e.key === 'Enter' && $('#tela-auth').classList.contains('ativa') && /^a-(email|senha|nome)$/.test(e.target.id)) acoes.authSubmit();
            return;
        }
        if (e.key === 'Escape') { ($('#btn-cancelar').style.display !== 'none' ? $('#btn-cancelar') : $('#modal-confirm')).click(); }
        if (e.key === 'Enter' && e.target.id === 'modal-input') $('#modal-confirm').click();
    });

    /* ================= telas ================= */
    function mostrar(nome) {
        ['carregando', 'auth', 'app'].forEach(n => $('#tela-' + n).classList.toggle('ativa', n === nome));
        if (nome === 'app') lucide.createIcons();
    }

    function ir(tab, extra = {}) {
        view = { tab, lojaId: null, marcaId: null, prod: null, preLoja: null, preMarca: '', origem: null, origemMarca: null, ...extra };
        desenhar(true);
        if (tab !== 'p' && tab !== 'c' && tab !== 'v') setTimeout(verificarVencidos, 300);
    }

    // Redesenha após mudanças vindas do banco, sem atrapalhar formulários abertos
    function atualizar() {
        if (!uid) return;
        if (view.tab === 'p' || view.tab === 'c' || view.tab === 'v') return;
        desenhar(false);
    }

    function desenhar(topo) {
        document.querySelectorAll('.nav-aba').forEach(b => b.classList.toggle('ativa', b.dataset.id === view.tab));
        const naConta = view.tab === 'c' || view.tab === 'r';
        $('#btn-conta').classList.toggle('text-amber-500',
