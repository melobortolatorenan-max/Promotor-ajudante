name: Relatório semanal aos superiores

on:
  schedule:
    - cron: '0 * * * *'       # de hora em hora; o script envia só no dia e hora escolhidos pelo promotor
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = só simular (padrão); false = enviar os relatórios'
        default: 'true'

jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        working-directory: scripts
        run: npm install --omit=dev --no-audit --no-fund
      - name: Enviar relatórios
        working-directory: scripts
        run: node relatorio-superiores.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: melobortolato.renan@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
