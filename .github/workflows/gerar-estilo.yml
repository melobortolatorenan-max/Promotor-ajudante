name: Gerar estilo

on:
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'vigia.js', 'rota.html', 'rota.js', 'estilo/input-estilo.css', 'estilo/tailwind.config.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  estilo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar styles.css
        run: npx --yes tailwindcss@3.4.17 -c estilo/tailwind.config.js -i estilo/input-estilo.css -o styles.css --minify
      - name: Salvar styles.css no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add styles.css
          git diff --cached --quiet || (git commit -m "Atualiza estilo" && git push)
