name: Resumo mensal de vencidos

on:
  schedule:
    - cron: '0 12 1 * *'      # dia 1 de cada mês, 09:00 de Brasília
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = só simular (padrão); false = enviar os resumos'
        default: 'true'

jobs:
  resumo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        working-directory: scripts
        run: npm install --omit=dev --no-audit --no-fund
      - name: Enviar resumos
        working-directory: scripts
        run: node relatorio-mensal.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: melobortolato.renan@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
