name: Avisos de vencimento

on:
  schedule:
    - cron: '30 9 * * *'   # reserva: 09:30 UTC = 06:30 em Brasília (o GitHub pode atrasar horas)
  workflow_dispatch:        # permite disparar na hora certa por um agendador externo e testar à mão
    inputs:
      forcar:
        description: 'true = enviar mesmo que já tenha enviado hoje (teste)'
        default: 'false'

jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        working-directory: scripts
        run: npm install --omit=dev --no-audit --no-fund
      - name: Enviar avisos
        working-directory: scripts
        run: node enviar-avisos.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCAR: ${{ github.event.inputs.forcar }}
          # Endereço do app na Vercel.
          APP_URL: https://promotor-ajudante.vercel.app/
