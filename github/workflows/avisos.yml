name: Avisos de vencimento

on:
  schedule:
    - cron: '5 9 * * *'    # 09:05 UTC = 06:05 no horário de Brasília
  workflow_dispatch:        # permite rodar manualmente para testar

jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        working-directory: scripts
        run: npm install --omit=dev --no-audit --no-fund
      - name: Enviar avisos
        working-directory: scripts
        run: node enviar-avisos.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Endereço do app na Vercel.
          APP_URL: https://promotor-ajudante.vercel.app/
